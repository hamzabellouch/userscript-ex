<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Userscript</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header with Master Toggle -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo">
          <img src="icons/icon-32.png" width="22" height="22" style="border-radius: 50%;" alt="Userscript" />
        </div>
        <div class="brand-text">
          <div class="brand-title">Userscript</div>
          <div class="brand-subtitle" id="master-status-text">Active</div>
        </div>
      </div>
      <div class="header-toggle">
        <label class="switch" title="Toggle Userscript Engine">
          <input type="checkbox" id="master-toggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <!-- Quick Action Bar -->
    <div class="action-bar">
      <button class="action-btn" id="btn-open-dashboard" title="Open Full Dashboard & Code Editor">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span>Dashboard</span>
      </button>

      <button class="action-btn" id="btn-toggle-url-box" title="Install script from URL">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>Add URL</span>
      </button>

      <button class="action-btn" id="btn-upload-file" title="Upload .user.js file">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span>File</span>
      </button>
      <input type="file" id="file-input" accept=".js,.user.js" style="display: none;">

      <button class="action-btn primary circle-btn" id="btn-new-script" title="Create a new script">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- Collapsible URL Install Form -->
    <div class="custom-card-wrapper hidden" id="url-install-section">
      <div class="wrapper-header">
        <span class="input-label">Install Script from URL</span>
        <button class="close-btn" id="btn-close-url-box">&times;</button>
      </div>
      <div class="url-input-group">
        <input type="url" id="script-url-input" placeholder="https://greasyfork.org/.../script.user.js" spellcheck="false" />
        <button id="btn-fetch-url" class="primary-btn">Fetch</button>
      </div>
      <div id="url-preview-card" class="preview-card hidden">
        <div class="preview-header">
          <span class="preview-name" id="preview-name">Script Name</span>
          <span class="preview-version" id="preview-version">v1.0.0</span>
        </div>
        <div class="preview-desc" id="preview-desc">Script description...</div>
        <div class="preview-matches" id="preview-matches"></div>
        <div class="preview-actions">
          <button id="btn-confirm-install-url" class="confirm-btn">Confirm & Install</button>
        </div>
      </div>
    </div>


    <!-- All Installed Scripts Section -->
    <div class="category-section">
      <div class="section-header-flex">
        <div class="category-title">Scripts (<span id="installed-count">0</span>)</div>
      </div>
      <div class="scripts-list all-scripts-container" id="all-scripts-list">
        <!-- Script items rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Message -->
  <div id="toast" class="toast-message">Action successful</div>

  <script src="engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
